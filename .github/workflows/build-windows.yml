name: Build Windows App
on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libgphoto2

      # --- LANGKAH PERBAIKAN UTAMA ---
      - name: Fix pkg-config and MSYS2 Paths for Windows
        shell: bash
        run: |
          # 1. Hapus symlink palsu yang tidak bisa dibaca Windows
          rm -f /c/msys64/mingw64/bin/pkg-config.exe
          
          # 2. Copy file .exe aslinya agar menjadi file executable sungguhan
          cp /c/msys64/mingw64/bin/pkgconf.exe /c/msys64/mingw64/bin/pkg-config.exe
          
          # 3. Gunakan backslash (\) ala Windows untuk PATH
          echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
          echo "C:\msys64\usr\bin" >> $GITHUB_PATH
          
          # 4. Beritahu Rust di mana letak konfigurasi libgphoto2
          echo "PKG_CONFIG_PATH=C:\msys64\mingw64\lib\pkgconfig" >> $GITHUB_ENV
      # ------------------------------

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust (GNU Toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Inject Environment Variables
        shell: bash
        run: |
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> .env
          echo "PUBLIC_API_BASE_URL=${{ secrets.PUBLIC_API_BASE_URL }}" >> .env
          echo "ADMIN_DASHBOARD_URL=${{ secrets.ADMIN_DASHBOARD_URL }}" >> .env

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}