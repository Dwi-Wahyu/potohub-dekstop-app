name: Build Windows App
on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libgphoto2

      # --- PERBAIKAN: Auto-Detect File Executable ---
      - name: Configure MSYS2 Environment for Windows
        shell: pwsh
        run: |
          $msysRoot = "C:\msys64"
          $msysBin = "$msysRoot\mingw64\bin"
          
          # 1. Cari file secara dinamis: pkgconf.exe ATAU x86_64...pkg-config.exe
          $targetExe = ""
          if (Test-Path "$msysBin\pkgconf.exe") {
              $targetExe = "$msysBin\pkgconf.exe"
          } elseif (Test-Path "$msysBin\x86_64-w64-mingw32-pkg-config.exe") {
              $targetExe = "$msysBin\x86_64-w64-mingw32-pkg-config.exe"
          } elseif (Test-Path "$msysBin\pkg-config.exe") {
              $targetExe = "$msysBin\pkg-config.exe"
          }
          
          # 2. Jika tetap tidak ada, hentikan dan tampilkan isi folder untuk debugging
          if ($targetExe -eq "") {
              Write-Error "CRITICAL: Tidak dapat menemukan satupun file pkg-config/pkgconf di $msysBin"
              Write-Host "Daftar file berawalan 'pkg' yang sebenarnya ada di folder tersebut:"
              Get-ChildItem -Path $msysBin -Filter "*pkg*.exe" | Select-Object Name
              exit 1
          }
          
          Write-Host "==============================================="
          Write-Host "Berhasil menemukan executable di: $targetExe"
          Write-Host "==============================================="
          
          $pkgConfigLib = "$msysRoot\mingw64\lib\pkgconfig"
          
          # 3. Inject ke environment GitHub Actions dengan UTF-8
          "$msysBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$msysRoot\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG=$targetExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$pkgConfigLib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # ----------------------------------------------

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust (GNU Toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Inject Environment Variables
        shell: bash
        run: |
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> .env
          echo "PUBLIC_API_BASE_URL=${{ secrets.PUBLIC_API_BASE_URL }}" >> .env
          echo "ADMIN_DASHBOARD_URL=${{ secrets.ADMIN_DASHBOARD_URL }}" >> .env

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}