name: Build Windows App
on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libgphoto2

      # --- PERBAIKAN: Menggunakan PowerShell Native Windows ---
      - name: Configure MSYS2 Environment for Windows
        shell: pwsh
        run: |
          # Cari lokasi instalasi MSYS2 secara dinamis
          $msysRoot = "C:\msys64"
          if (-not (Test-Path $msysRoot)) {
              $msysRoot = "D:\a\_temp\msys64" # Lokasi fallback di beberapa runner GitHub
          }
          Write-Host "Menggunakan MSYS2 di: $msysRoot"
          
          # Tentukan folder bin dan pkgconfig
          $mingwBin = "$msysRoot\mingw64\bin"
          $usrBin = "$msysRoot\usr\bin"
          $pkgConfigLib = "$msysRoot\mingw64\lib\pkgconfig"
          
          # Daftarkan ke PATH dengan format Windows (\), bukan Linux (/)
          echo "$mingwBin" >> $env:GITHUB_PATH
          echo "$usrBin" >> $env:GITHUB_PATH
          
          # Daftarkan lokasi file .pc milik libgphoto2
          echo "PKG_CONFIG_PATH=$pkgConfigLib" >> $env:GITHUB_ENV
      # --------------------------------------------------------

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust (GNU Toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Inject Environment Variables
        shell: bash
        run: |
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> .env
          echo "PUBLIC_API_BASE_URL=${{ secrets.PUBLIC_API_BASE_URL }}" >> .env
          echo "ADMIN_DASHBOARD_URL=${{ secrets.ADMIN_DASHBOARD_URL }}" >> .env

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}