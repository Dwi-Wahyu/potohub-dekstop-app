name: Build Windows App
on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libgphoto2

      # --- PERBAIKAN FINAL: Enkoding UTF-8 dan Jalur Absolut Windows ---
      - name: Configure MSYS2 Environment for Windows
        shell: pwsh
        run: |
          $msysBin = "C:\msys64\mingw64\bin"
          $pkgConfigExe = "$msysBin\pkg-config.exe"
          $pkgConfigPath = "C:\msys64\mingw64\lib\pkgconfig"
          
          # Validasi apakah MSYS2 benar-benar terinstal dan file exe ada
          if (-not (Test-Path $pkgConfigExe)) {
              Write-Error "CRITICAL: pkg-config.exe tidak ditemukan di $pkgConfigExe"
              exit 1
          }
          
          # WAJIB menggunakan Out-File -Encoding utf8. Jika pakai >> Actions tidak bisa membacanya!
          "$msysBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG=$pkgConfigExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$pkgConfigPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # -----------------------------------------------------------------

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust (GNU Toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Inject Environment Variables
        shell: bash
        run: |
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> .env
          echo "PUBLIC_API_BASE_URL=${{ secrets.PUBLIC_API_BASE_URL }}" >> .env
          echo "ADMIN_DASHBOARD_URL=${{ secrets.ADMIN_DASHBOARD_URL }}" >> .env

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}