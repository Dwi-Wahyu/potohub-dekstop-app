name: Build Windows App
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libgphoto2

      - name: Configure MSYS2 Environment for Windows
        shell: msys2 {0}
        run: |
          which pkg-config || pacman -S --noconfirm mingw-w64-x86_64-pkg-config
          echo "PKG_CONFIG_PATH=/mingw64/lib/pkgconfig" >> $GITHUB_ENV

      - name: Prepare libgphoto2 DLLs for Tauri Bundling
        shell: msys2 {0}
        run: |
          mkdir -p src-tauri/gphoto-libs/camlibs
          mkdir -p src-tauri/gphoto-libs/iolibs
          cp -r /mingw64/lib/libgphoto2/*/* src-tauri/gphoto-libs/camlibs/ 2>/dev/null || true
          cp -r /mingw64/lib/libgphoto2_port/*/* src-tauri/gphoto-libs/iolibs/ 2>/dev/null || true
          cp /mingw64/bin/libgphoto2-6.dll src-tauri/gphoto-libs/ 2>/dev/null || true
          cp /mingw64/bin/libgphoto2_port-12.dll src-tauri/gphoto-libs/ 2>/dev/null || true
          cp /mingw64/bin/libexif-12.dll src-tauri/gphoto-libs/ 2>/dev/null || true
          cp /mingw64/bin/libusb-1.0.dll src-tauri/gphoto-libs/ 2>/dev/null || true
          cp /mingw64/bin/libltdl-7.dll src-tauri/gphoto-libs/ 2>/dev/null || true
          cp /mingw64/bin/libintl-8.dll src-tauri/gphoto-libs/ 2>/dev/null || true
          cp /mingw64/bin/libiconv-2.dll src-tauri/gphoto-libs/ 2>/dev/null || true
          cp /mingw64/bin/libgcc_s_seh-1.dll src-tauri/gphoto-libs/ 2>/dev/null || true
          cp /mingw64/bin/libwinpthread-1.dll src-tauri/gphoto-libs/ 2>/dev/null || true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust (GNU Toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Inject Environment Variables
        shell: bash
        run: |
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> .env
          echo "PUBLIC_API_BASE_URL=${{ secrets.PUBLIC_API_BASE_URL }}" >> .env
          echo "ADMIN_DASHBOARD_URL=${{ secrets.ADMIN_DASHBOARD_URL }}" >> .env

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}